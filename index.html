<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideosFree-br - Criador 3D</title>
  
  <!-- Script Oficial do Google para carregar arquivos 3D (.glb) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tela Principal - Ocupa 100% da tela física e usa o cenário como background total */
    .game-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px; /* Mantém a proporção em telas maiores, ou preenche celular */
      background-image: url('assets/cenario.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover; /* Faz a imagem cobrir 100% sem deixar nenhuma faixa preta */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Área de Exibição do Modelo 3D Flutuando sobre o Círculo/Plataforma */
    .viewport {
      position: absolute;
      top: 18%; 
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 60%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Container dos Botões Flutuando no Rodapé da Imagem */
    .ui-container {
      position: absolute;
      bottom: 25px; /* Posição exata sobre a base do cenário */
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    /* Estilização dos Botões no formato de Espada / Lâmina de Pedra */
    .sword-btn {
      position: relative;
      flex: 1;
      max-width: 200px;
      height: 48px;
      background: linear-gradient(180deg, #3a3b40 0%, #1e1f24 50%, #0d0e11 100%);
      color: #9a9b9e;
      border: none;
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease-in-out;
      user-select: none;

      /* Recorte em formato de Lâmina / Hexágono alongado */
      clip-path: polygon(
        12px 0%, 
        calc(100% - 12px) 0%, 
        100% 50%, 
        calc(100% - 12px) 100%, 
        12px 100%, 
        0% 50%
      );

      /* Sombra para destacar da imagem de fundo */
      filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.9));
    }

    /* Borda metálica interna simulada */
    .sword-btn::before {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      right: 2px;
      bottom: 2px;
      background: linear-gradient(180deg, #2a2b2e 0%, #111215 100%);
      clip-path: polygon(
        11px 0%, 
        calc(100% - 11px) 0%, 
        100% 50%, 
        calc(100% - 11px) 100%, 
        11px 100%, 
        0% 50%
      );
      z-index: 1;
    }

    /* Texto do Botão */
    .sword-btn span {
      position: relative;
      z-index: 2;
      text-shadow: 1px 1px 2px #000;
    }

    /* Detalhe de guarda/cabo da espada no canto esquerdo */
    .sword-btn::after {
      content: '';
      position: absolute;
      left: 4px;
      width: 4px;
      height: 60%;
      background: #55565b;
      border-radius: 2px;
      z-index: 2;
      box-shadow: 0 0 2px #000;
    }

    /* Hover */
    .sword-btn:hover {
      color: #dcdde1;
    }

    /* EFEITO DE AFUNDAR (Clique Real / Pressão) */
    .sword-btn:active {
      transform: translateY(4px) scale(0.97);
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.9));
    }

    /* ESTADO ATIVO (Gênero Selecionado) - Brilho Vermelho Sombrio */
    .sword-btn.active {
      background: linear-gradient(180deg, #ff3355 0%, #99001f 50%, #4a000e 100%);
      color: #ffffff;
      filter: drop-shadow(0 0 10px rgba(255, 0, 51, 0.7));
    }

    .sword-btn.active::before {
      background: linear-gradient(180deg, #2b080e 0%, #140205 100%);
    }

    .sword-btn.active span {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 0, 51, 0.9), 1px 1px 3px #000;
    }

    .sword-btn.active::after {
      background: #ff0033;
      box-shadow: 0 0 6px #ff0033;
    }
  </style>
</head>
<body>

  <div class="game-screen">

    <!-- Renderizador 3D -->
    <div class="viewport">
      <model-viewer 
        id="hero-3d"
        src="assets/masculino.glb" 
        alt="Personagem Masculino 3D"
        camera-controls 
        disable-zoom
        disable-pan
        interaction-prompt="none"
        auto-rotate
        autoplay
        shadow-intensity="1"
        exposure="1"
        camera-orbit="0deg 75deg 3.0m"
        camera-target="auto auto auto"
        min-camera-orbit="-infinity 75deg 3.0m"
        max-camera-orbit="infinity 75deg 3.0m">
      </model-viewer>
    </div>

    <!-- Interface do Usuário (Botões em formato de Espada posicionados sobre o cenário) -->
    <div class="ui-container">
      <div class="btn-group">
        <button class="sword-btn active" id="btn-m" onclick="setGender('masculino')">
          <span>Masculino</span>
        </button>
        <button class="sword-btn" id="btn-f" onclick="setGender('feminino')">
          <span>Feminino</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    function setGender(gender) {
      const viewer = document.getElementById('hero-3d');
      const btnM = document.getElementById('btn-m');
      const btnF = document.getElementById('btn-f');

      if (gender === 'masculino') {
        viewer.src = 'assets/masculino.glb';
        btnM.classList.add('active');
        btnF.classList.remove('active');
      } else {
        viewer.src = 'assets/feminino.glb';
        btnF.classList.add('active');
        btnM.classList.remove('active');
      }
    }
  </script>
</body>
</html>
