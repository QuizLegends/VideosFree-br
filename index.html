<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideosFree-br - Criador 3D</title>
  
  <!-- Script Oficial do Google para carregar arquivos 3D (.glb) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tela Principal */
    .game-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('assets/cenario.png');
      background-position: center top;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Área de Exibição do Modelo 3D */
    .viewport {
      position: absolute;
      top: 18%; 
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 62%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Container dos Botões - Subido ~1.5cm (bottom: 45px) */
    .ui-container {
      position: absolute;
      bottom: 45px; 
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    /* Botões Retangulares - Cinza Ferrugem com Borda Dourada */
    .rusty-btn {
      flex: 1;
      max-width: 180px;
      height: 48px;
      /* Fundo Cinza Sujo / Metal Oxidado com ferrugem escura */
      background: radial-gradient(circle, #3d3b37 0%, #292826 60%, #171614 100%);
      color: #c5bba8;
      border: 2px solid #b8860b; /* Borda Dourada Metálica */
      border-radius: 0px; /* Pontas Quadradas / Retangular */
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease-in-out;
      user-select: none;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9), 0 4px 8px rgba(0, 0, 0, 0.8);
      text-shadow: 1px 1px 3px #000;
    }

    /* Hover */
    .rusty-btn:hover {
      color: #ffd700;
      border-color: #ffd700;
    }

    /* EFEITO DE AFUNDAR (Clique Real / Pressão) */
    .rusty-btn:active {
      transform: translateY(4px) scale(0.97);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.95), 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* Estado Selecionado / Ativo - Dourado Vivo com Fundo Sujo Iluminado */
    .rusty-btn.active {
      background: radial-gradient(circle, #4d4436 0%, #2e261b 60%, #1c150c 100%);
      color: #ffd700;
      border-color: #ffe066;
      box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.3), 0 0 12px rgba(184, 134, 11, 0.6);
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.7), 1px 1px 3px #000;
    }
  </style>
</head>
<body>

  <div class="game-screen">

    <!-- Renderizador 3D -->
    <div class="viewport">
      <model-viewer 
        id="hero-3d"
        src="assets/masculino.glb" 
        alt="Personagem Masculino 3D"
        camera-controls 
        disable-zoom
        disable-pan
        interaction-prompt="none"
        auto-rotate
        autoplay
        shadow-intensity="1"
        exposure="1"
        camera-orbit="0deg 75deg 2.2m"
        camera-target="auto auto auto"
        min-camera-orbit="-infinity 75deg 2.2m"
        max-camera-orbit="infinity 75deg 2.2m">
      </model-viewer>
    </div>

    <!-- Interface dos Botões -->
    <div class="ui-container">
      <div class="btn-group">
        <button class="rusty-btn active" id="btn-m" onclick="setGender('masculino')">
          Masculino
        </button>
        <button class="rusty-btn" id="btn-f" onclick="setGender('feminino')">
          Feminino
        </button>
      </div>
    </div>

  </div>

  <script>
    function setGender(gender) {
      const viewer = document.getElementById('hero-3d');
      const btnM = document.getElementById('btn-m');
      const btnF = document.getElementById('btn-f');

      if (gender === 'masculino') {
        viewer.src = 'assets/masculino.glb';
        btnM.classList.add('active');
        btnF.classList.remove('active');
      } else {
        viewer.src = 'assets/feminino.glb';
        btnF.classList.add('active');
        btnM.classList.remove('active');
      }
    }
  </script>
</body>
</html>
