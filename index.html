<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideosFree-br - Criador 3D</title>
  
  <!-- Script Oficial do Google para carregar arquivos 3D (.glb) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Tela Principal */
    .game-screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: url('assets/cenario.png');
      background-position: center top;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Área de Exibição do Modelo 3D */
    .viewport {
      position: absolute;
      top: 18%; 
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 62%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Container dos Botões */
    .ui-container {
      position: absolute;
      bottom: 45px; 
      left: 0;
      width: 100%;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
    }

    .btn-group {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
    }

    /* Botões Retangulares - Cinza Ferrugem com Trincas e Bordas Douradas */
    .rusty-btn {
      position: relative;
      flex: 1;
      max-width: 180px;
      height: 48px;
      /* Fundo Cinza Sujo / Metal Oxidado com textura de desgaste */
      background: radial-gradient(circle, #3d3b37 0%, #292826 60%, #171614 100%);
      color: #c5bba8;
      border: 2px solid #b8860b; /* Borda Dourada Metálica */
      border-radius: 0px; /* Pontas Quadradas / Retangular */
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s ease-in-out;
      user-select: none;
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9), 0 4px 8px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    /* Camada para o Texto do Botão (fica acima das rachaduras) */
    .btn-text {
      position: relative;
      z-index: 3;
      text-shadow: 1px 1px 3px #000, 0 0 5px rgba(0,0,0,0.8);
    }

    /* Desenho de Rachaduras e Trincas via SVG integrado */
    .cracks-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.8;
    }

    .crack-line {
      stroke: #0a0a0b;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(1px 1px 0px rgba(255, 255, 255, 0.08));
    }

    /* Hover */
    .rusty-btn:hover {
      color: #ffd700;
      border-color: #ffd700;
    }

    .rusty-btn:hover .crack-line {
      stroke: #050505;
      stroke-width: 2;
    }

    /* EFEITO DE AFUNDAR (Clique Real / Pressão) */
    .rusty-btn:active {
      transform: translateY(4px) scale(0.97);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.95), 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    /* Estado Selecionado / Ativo - Dourado Vivo com Trincas Destacadas */
    .rusty-btn.active {
      background: radial-gradient(circle, #4d4436 0%, #2e261b 60%, #1c150c 100%);
      color: #ffd700;
      border-color: #ffe066;
      box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.3), 0 0 12px rgba(184, 134, 11, 0.6);
    }

    .rusty-btn.active .btn-text {
      color: #ffd700;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.7), 1px 1px 3px #000;
    }

    .rusty-btn.active .crack-line {
      stroke: #000000;
      filter: drop-shadow(1px 1px 0px rgba(255, 224, 102, 0.25));
    }
  </style>
</head>
<body>

  <div class="game-screen">

    <!-- Renderizador 3D -->
    <div class="viewport">
      <model-viewer 
        id="hero-3d"
        src="assets/masculino.glb" 
        alt="Personagem Masculino 3D"
        camera-controls 
        disable-zoom
        disable-pan
        interaction-prompt="none"
        auto-rotate
        autoplay
        shadow-intensity="1"
        exposure="1"
        camera-orbit="0deg 75deg 2.2m"
        camera-target="auto auto auto"
        min-camera-orbit="-infinity 75deg 2.2m"
        max-camera-orbit="infinity 75deg 2.2m">
      </model-viewer>
    </div>

    <!-- Interface dos Botões com Trincas e Rachaduras -->
    <div class="ui-container">
      <div class="btn-group">
        
        <!-- Botão Masculino -->
        <button class="rusty-btn active" id="btn-m" onclick="setGender('masculino')">
          <svg class="cracks-svg" viewBox="0 0 180 48">
            <!-- Rachadura principal atravessando o canto esquerdo superior -->
            <path class="crack-line" d="M 0 8 L 22 14 L 38 7 L 55 18" />
            <!-- Trinca secundária saindo da borda direita inferior -->
            <path class="crack-line" d="M 180 38 L 152 32 L 140 42" />
            <!-- Micro rachadura central -->
            <path class="crack-line" d="M 95 0 L 102 12 L 98 20" />
          </svg>
          <span class="btn-text">Masculino</span>
        </button>

        <!-- Botão Feminino -->
        <button class="rusty-btn" id="btn-f" onclick="setGender('feminino')">
          <svg class="cracks-svg" viewBox="0 0 180 48">
            <!-- Rachadura atravessando o canto direito superior -->
            <path class="crack-line" d="M 180 12 L 155 18 L 138 9 L 120 22" />
            <!-- Trinca saindo da borda esquerda inferior -->
            <path class="crack-line" d="M 0 35 L 28 30 L 45 44" />
            <!-- Micro rachadura no canto inferior direito -->
            <path class="crack-line" d="M 110 48 L 115 35 L 125 30" />
          </svg>
          <span class="btn-text">Feminino</span>
        </button>

      </div>
    </div>

  </div>

  <script>
    function setGender(gender) {
      const viewer = document.getElementById('hero-3d');
      const btnM = document.getElementById('btn-m');
      const btnF = document.getElementById('btn-f');

      if (gender === 'masculino') {
        viewer.src = 'assets/masculino.glb';
        btnM.classList.add('active');
        btnF.classList.remove('active');
      } else {
        viewer.src = 'assets/feminino.glb';
        btnF.classList.add('active');
        btnM.classList.remove('active');
      }
    }
  </script>
</body>
</html>
